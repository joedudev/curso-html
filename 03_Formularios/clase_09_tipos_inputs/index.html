<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Tipos de Inputs</title>
	</head>
	<body>
		<form action="#" method="post">
			<div>
				<label for="password">Contraseña:</label>
				<input type="password" name="password" id="password" />
			</div>
			<div>
				<label for="edad">Edad:</label>
				<input type="number" name="edad" id="edad" min="18" max="70" />
			</div>
			<div>
				<label for="fecha">Fecha:</label
				><input type="date" name="fecha" id="fecha" />
			</div>
			<div>
				<label for="color">Color:</label>
				<input type="color" name="color" id="color" />
			</div>
			<fieldset>
				<legend>Género:</legend>
				<input type="radio" name="genero" id="masculino" value="masculino" />
				<label for="masculino">Masculino</label>
				<input type="radio" name="genero" id="femenino" value="femenino" />
				<label for="femenino">Femenino</label>
			</fieldset>

			<fieldset>
				<legend>Intereses</legend>
				<input type="checkbox" name="intereses[]" id="leer" value="leer" />
				<label for="leer">Leer</label>
				<input
					type="checkbox"
					name="intereses[]"
					id="deportes"
					value="deportes"
				/>
				<label for="deportes">Deportes</label>
				<input type="checkbox" name="intereses[]" id="musica" value="musica" />
				<label for="musica">Música</label>
			</fieldset>

			<div>
				<label for="Pais">País:</label>
				<select name="pais" id="pais">
					<option value="Mexico">México</option>
					<option value="USA">Estados Unidos</option>
					<option value="Canada">Canadá</option>
					<option value="Brazil">Brasil</option>
					<option value="Guatemala">Guatemala</option>
				</select>
			</div>
		</form>
	</body>
</html>
