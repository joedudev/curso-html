<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Tablas</title>
	</head>
	<body>
		<table>
			<thead>
				<tr>
					<th>Producto</th>
					<th>Precio</th>
					<th>Cantidad</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>Laptop</td>
					<td>$10.00</td>
					<td>5</td>
				</tr>
				<tr>
					<td>Mouse</td>
					<td>$20.00</td>
					<td>3</td>
				</tr>
				<tr>
					<td>Teclado</td>
					<td>$50.00</td>
					<td>2</td>
				</tr>
			</tbody>
			<tfoot>
				<tr>
					<td>Total</td>
					<td>$80.00</td>
					<td>10</td>
				</tr>
			</tfoot>
		</table>
	</body>
</html>
