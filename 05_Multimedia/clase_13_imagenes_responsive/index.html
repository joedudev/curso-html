<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Imagenes Responsive</title>
	</head>
	<body>
		<img
			src="IMG/hero-400.jpg"
			alt="vista panoramica"
			srcset="
				IMG/hero-400.jpg   400w,
				IMG/hero-800.jpg   800w,
				IMG/hero-1200.jpg 1200w
			"
			sizes="(max-width 600px) 100vw, 50vw"
		/>
		<picture>
			<source
				media="(min-width: 768px)"
				srcset="IMG/banner-desktop-800x400.jpg"
			/>
			<source
				media="(min-width: 480px)"
				srcset="IMG/banner-tablet-600x300.jpg"
			/>
			<img src="IMG/banner-movil-400x200.jpg" alt="paisajes naturales" />
		</picture>

		<img
			src="IMG/producto-600.jpg"
			alt="producto destacado"
			srcset="IMG/producto-300.jpg, IMG/producto-600.jpg 600wv"
			sizes="(max-width: 600px) 100vw, 50vw"
			loading="lazy"
			decoding="async"
			width="600"
			height="400"
		/>
	</body>
</html>
